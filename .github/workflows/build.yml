name: Build PingR APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name pingr --platforms=android
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="pingr"#android:label="PingR"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "^\s*error" analyze.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pingr-apk
          path: build/app/outputs/flutter-apk/app-release.apk
